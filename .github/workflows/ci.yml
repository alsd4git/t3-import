name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        node: [22, 24, 26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run package:check

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.repository == 'alsd4git/t3-import'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@12.2.0
      - run: npm ci
      - run: npm run release:ci -- check-npm
      - name: Prepare release tarball and metadata
        run: npm run release:ci -- prepare
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ github.ref_name }}
          path: artifacts/release/*
          if-no-files-found: error
          retention-days: 30
      - name: Publish exact release tarball to npm
        run: npm run release:ci -- publish
      - name: Create or resume GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run release:ci -- github-release
